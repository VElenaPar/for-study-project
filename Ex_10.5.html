<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScreenSizeButton</title>
    <style>
        .btn {
            background-color: #007bff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            }

        .btn:hover {
            background-color: #0056b3;
            }
    </style>
</head>
<body>
    <button id="screenSizeButton" class="btn">
        Узнать размеры экрана
      </button>

      <script>
        const screenSizeButton = document.getElementById('screenSizeButton');

        screenSizeButton.addEventListener('click', () => {

        const screenWidth = window.screen.width;
        const screenHeight = window.screen.height;

        const message = `Размеры экрана: Ширина экрана: ${screenWidth}px; Высота экрана: ${screenHeight}px`;

        alert(message);
        });
      </script>
</body>
</html>
